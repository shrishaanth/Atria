<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f4">
<meta name="description" content="Atria — plan your day honestly: time-blocking, timers that learn how long things really take, and repeating tasks.">
<title>Atria</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atria">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem("atria-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=3">
<!-- bump v on every deploy (here, the script tag and sw.js) so browsers never mix old and new modules -->
<script type="importmap">{"imports":{
  "./js/app.js":"./js/app.js?v=3","./js/model.js":"./js/model.js?v=3","./js/store.js":"./js/store.js?v=3","./js/actions.js":"./js/actions.js?v=3",
  "./js/sheets.js":"./js/sheets.js?v=3","./js/ui.js":"./js/ui.js?v=3","./js/util.js":"./js/util.js?v=3","./js/sync.js":"./js/sync.js?v=3",
  "./js/views/today.js":"./js/views/today.js?v=3","./js/views/week.js":"./js/views/week.js?v=3","./js/views/inbox.js":"./js/views/inbox.js?v=3",
  "./js/views/repeat.js":"./js/views/repeat.js?v=3","./js/views/insights.js":"./js/views/insights.js?v=3","./js/views/settings.js":"./js/views/settings.js?v=3"
}}</script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="stage">
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<nav class="dock" id="nav" aria-label="Main"></nav>
<button class="fab" data-quick aria-label="New task"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js?v=3"></script>
<noscript><p style="padding:24px">Atria needs JavaScript.</p></noscript>
</body>
</html>
